version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quiz_bot}
    ports:
      # Tashqaridan (serverdan) 5433 orqali kiriladi, ichkarida baza 5432 da ishlaydi
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      # Bot baza bilan to'g'ridan-to'g'ri ichki tarmoqda (5432) gaplashadi
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Tashqaridan 8080 orqali kiriladi, ichkarida FastAPI 9000 da ishlaydi
      - "8080:9000"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --reload

volumes:
  postgres_data:
